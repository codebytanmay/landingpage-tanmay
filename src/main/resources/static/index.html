<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🚀 Welcome to My Website</h1>
    <p>Java Full Stack Internship Project</p>
</header>

<section class="hero">
    <h2>Build Modern Web Applications</h2>
    <p>Learn HTML, CSS, Java and Spring Boot.</p>
</section>
<section class="contact">

    <h2>Contact Us</h2>

    <form action="/contact" method="post">

        <input type="text"
               name="name"
               placeholder="Your Name"
               required>

        <input type="email"
               name="email"
               placeholder="Your Email"
               required>

        <textarea
                name="message"
                placeholder="Your Message"
                required></textarea>

        <button type="submit">
            Send Message
        </button>

    </form>

</section>

</body>
</html>
